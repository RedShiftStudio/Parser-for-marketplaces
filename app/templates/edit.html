{% extends "base.html" %}{% block content %}<section class="panel"><h2>Редактировать мониторинг #{{ search.id }}</h2><p class="muted">Изменения действуют для следующих запусков, результаты прошлых запусков сохраняются.</p><form action="/searches/{{ search.id }}/edit" method="post"><input type="hidden" name="token" value="{{ csrf }}"><label>Название<input name="name" maxlength="120" value="{{ search.name }}" required></label><label>Поисковая фраза<input name="query" maxlength="300" value="{{ search.query }}" required></label><div class="choices">Площадки:<br>{% for key in sites %}<label><input type="checkbox" name="sites" value="{{ key }}" {% if key in search.sites.split(',') %}checked{% endif %}> {{ key }}</label>{% endfor %}</div><label>Страниц на площадку<input type="number" name="pages" min="1" max="10" value="{{ search.pages }}" required></label><label>Повторять каждые N часов (0 — только вручную)<input type="number" name="interval_hours" min="0" max="720" value="{{ search.interval_hours }}" required></label><button>Сохранить</button> <a href="/">Отмена</a></form></section>{% endblock %}
