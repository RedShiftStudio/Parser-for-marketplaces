<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketplace CRM</title>
<style>
:root{font-family:system-ui,sans-serif;color:#162236;background:#f3f6fa}body{max-width:1200px;margin:0 auto;padding:24px}header,nav,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}header{margin-bottom:25px}h1{font-size:26px}h2{font-size:19px}a{color:#1559af}main{display:grid;gap:20px}.panel{background:white;padding:22px;border-radius:12px;box-shadow:0 2px 12px #16223610}input,select,button{font:inherit;padding:9px;border:1px solid #cad4e2;border-radius:6px}button{background:#1559af;color:white;border:0;cursor:pointer}button.secondary{background:#58677b}form.inline{display:inline}label{display:block;margin:12px 0}label input:not([type=checkbox]){display:block;width:min(100%,480px);box-sizing:border-box;margin-top:5px}.choices label{display:inline-block;margin-right:16px}table{border-collapse:collapse;width:100%}th,td{padding:10px;text-align:left;border-bottom:1px solid #e5eaf0;vertical-align:top}td{overflow-wrap:anywhere} .scroll{overflow-x:auto}.muted{color:#657387}.error{color:#b32730;white-space:pre-wrap}.badge{background:#e9eef5;padding:4px 8px;border-radius:6px}img.thumb{width:65px;height:65px;object-fit:contain}@media(max-width:650px){body{padding:12px}.row{display:block}td,th{min-width:90px}}
</style></head><body><header><h1><a href="/">Marketplace CRM</a></h1>{% if user %}<nav><span>{{ user.email }}</span><form class="inline" method="post" action="/logout"><input type="hidden" name="token" value="{{ csrf }}"><button class="secondary">Выйти</button></form></nav>{% endif %}</header><main>{% block content %}{% endblock %}</main></body></html>
